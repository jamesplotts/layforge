<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layforge</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dice.css" />
</head>
<body>
  <!-- Join screen: gathers campaign_id / character_id / sender_id before
       opening the WebSocket and running the system.connect handshake
       (protocol/asyncapi.yaml, design doc §5). -->
  <section id="join-screen" class="screen">
    <div class="join-card">
      <h1>Layforge</h1>
      <p class="tagline">Connect to a Master.</p>
      <label>
        Master WebSocket URL
        <input id="join-url" type="text" />
      </label>
      <label>
        Campaign ID
        <input id="join-campaign" type="text" placeholder="e.g. my-campaign" />
      </label>
      <label>
        Character name
        <input id="join-character" type="text" placeholder="e.g. Kestrel" />
      </label>
      <button id="join-button" type="button">Join</button>
      <p id="join-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Chat screen: narrative scrollback (design doc §4's V1 client),
       history paging, and a safety-flag control (§9.2). No stat panel,
       dice tray, or push-to-talk yet — Master doesn't implement the
       system-engine or audio paths those need. -->
  <section id="chat-screen" class="screen" hidden>
    <header class="chat-header">
      <div>
        <strong id="chat-campaign-label"></strong>
        <span id="chat-status" class="status">connecting…</span>
      </div>
      <button id="safety-flag-button" type="button" title="X-card / veil — interrupts the scene for everyone">
        Safety Flag
      </button>
    </header>

    <!-- Inline, non-modal panel — deliberately not window.prompt(): a
         native dialog blocks the page's whole JS thread until dismissed,
         which is both bad UX and breaks anything driving the page
         programmatically (browser automation, tests). -->
    <div id="safety-flag-panel" class="safety-panel" hidden>
      <label>
        Topic (optional — leave blank for a bare X-card)
        <input id="safety-flag-topic" type="text" placeholder="e.g. combat" />
      </label>
      <div class="safety-panel-actions">
        <button id="safety-flag-cancel" type="button" class="secondary">Cancel</button>
        <button id="safety-flag-send" type="button">Raise Flag</button>
      </div>
    </div>

    <!-- Two-column body: chat-main (scrollback, dice tray, input) on the
         left, the character sidebar on the right. Sidebar placement is a
         pure CSS choice (see the .chat-body/.character-sidebar rules in
         style.css) — flip it to the other side by editing that one rule,
         nothing in this markup or app.js assumes a side. -->
    <div class="chat-body">
      <div class="chat-main">
        <button id="load-earlier-button" type="button" class="load-earlier" hidden>
          Load earlier history
        </button>
        <div id="log" class="log"></div>

        <!-- Dice tray: authoritative server roll, cosmetic client
             animation (design doc §3.1, §4) — roll.check_request in,
             roll.request/roll.result out. Disabled until join's stopgap
             character upload (see app.js) resolves, since a check needs
             a real character_id Master's store recognizes, not just the
             display name typed at join. -->
        <div class="dice-tray">
          <div class="dice-tray-stage" id="dice-stage"></div>
          <div class="dice-tray-controls">
            <div class="dice-tray-row">
              <select id="roll-ability">
                <option value="Strength">Strength</option>
                <option value="Dexterity">Dexterity</option>
                <option value="Constitution">Constitution</option>
                <option value="Intelligence">Intelligence</option>
                <option value="Wisdom">Wisdom</option>
                <option value="Charisma">Charisma</option>
              </select>
              <button id="roll-check-button" type="button" disabled>Roll Check</button>
              <label class="dice-skin-picker">
                Skin
                <!-- Options populated at load from Dice.listSkins() (see
                     dice-skins.js) rather than hardcoded here, so adding
                     a community skin never requires touching this
                     file. -->
                <select id="dice-skin-select"></select>
              </label>
            </div>
            <div id="dice-tray-result" class="dice-tray-result"></div>
          </div>
        </div>

        <form id="input-form" class="input-form">
          <input id="input-text" type="text" placeholder="What do you do?" autocomplete="off" />
          <button id="input-send" type="submit">Send</button>
        </form>
      </div>

      <!-- Character sidebar: rendered generically from whatever
           json_schema the active system engine's character.schema_
           response declares (design doc §4) — character-sheet.js has no
           D&D-specific field names in it, including the tabs
           themselves, which are derived from the schema's own top-level
           property shapes rather than a hardcoded "Stats/Abilities/
           Spells/Inventory" list (see renderCharacterSheetTabs's doc
           comment). The sheet itself is read-only (no per-field
           editing/write-back); the effect row below the tabs is a
           separate, narrower path that mutates the character via
           character.apply_effect (design doc §6.1's apply_effect()) and
           re-renders the sheet from the result. -->
      <aside class="character-sidebar">
        <div class="character-sidebar-header">Character</div>
        <div id="character-tabs" class="character-tabs" role="tablist"></div>
        <div id="character-tab-panels" class="character-tab-panels"></div>
        <div class="character-sheet-effect-row">
          <input id="effect-amount" type="number" min="1" value="5" />
          <button id="effect-damage-button" type="button" class="secondary" disabled>Take Damage</button>
          <button id="effect-heal-button" type="button" class="secondary" disabled>Heal</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- Both modules: dice.js imports three.js/cannon-es as ES modules
       (vendor/, see vendor/README.md) and must be one itself; app.js is
       one too so its execution is guaranteed to wait until after dice.js
       has attached window.Dice — module scripts run in document order,
       after parsing, unlike a plain classic script. -->
  <script type="module" src="dice.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
